<nav aria-label="Percorso di navigazione">
    <ol class="breadcrumb m-0 p-0 bg-transparent">
        {%- if pagename == master_doc %}
        <li class="breadcrumb-item active" aria-current="page">{{ theme_project_name }}</li>
        {%- else %}
        <li class="breadcrumb-item"><a href="{{ pathto(master_doc) }}">{{ theme_project_name }}</a></li>
        {%- for doc in parents %}
            <li class="breadcrumb-item"><a href="{{ doc.link|e }}">{{ doc.title }}</a></li>
        {%- endfor %}
        <li class="breadcrumb-item active" aria-current="page">{{ title }}</li>
        {%- endif %}
    </ol>
</nav>
